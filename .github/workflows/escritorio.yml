name: Escritorio

# El escritorio vive en escritorio/ desde el 26/10 (antes era el repo dolphin-escritorio).
# master es la rama del repo de trabajo; main, la del repo público (la foto de cada versión).
on:
  push:
    branches: [master, main]
    paths: ['escritorio/**', '.github/workflows/escritorio.yml']
  pull_request:
    branches: [master, main]
    paths: ['escritorio/**', '.github/workflows/escritorio.yml']
  workflow_dispatch:

# Un push nuevo cancela la corrida del anterior: con varios seguidos solo
# importa la última.
concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # En Linux, y no en Windows, por dos razones que van juntas: un minuto de
    # Windows se cobra como dos, y la suite del escritorio en Windows tiene una
    # veintena de hojas que fallan por el sistema y no por el código (comillas
    # POSIX, ACL, tmux, WSL, goldens), así que pagaba el doble por un rojo que
    # no decía nada. Windows lo corre Nico en su máquina, que es donde trabaja.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escritorio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: escritorio/package.json
          cache: pnpm
          cache-dependency-path: escritorio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # El runner se moría a los ~3 min de lint («The runner has received a shutdown signal», en el
      # privado «exit code 143», sin salida): se quedaba sin memoria. El que la come es el paso
      # type-aware (`audit:code-quality:type-aware`): tsgolint arma el programa TypeScript entero y
      # abre UN checker por cada GOMAXPROCS, cada uno con sus cachés de tipos. Medido en la máquina
      # de Nico sobre el árbol del 15/11: 13,7 GB de pico con 16 checkers y 10,2 GB con 2 (pasa, 0
      # hallazgos). Casi todo es el programa, no los checkers, y encima run-lint.mjs corría otro paso
      # al lado: en el runner de 16 GB no entraban los dos. Así que en CI: los pasos de a uno
      # (`--maxWorkers=1`), tsgolint con 2 checkers, y un techo blando para el GC de Go por encima
      # de lo que vive (10 GB: con un techo menor el GC trabaja sin parar y no baja el pico) y por
      # debajo de lo que tiene el runner. `--timings` deja el tiempo de cada paso en el log.
      - name: Lint
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 12GiB
        run: pnpm lint --maxWorkers=1 --timings

      - name: Test
        run: pnpm test
