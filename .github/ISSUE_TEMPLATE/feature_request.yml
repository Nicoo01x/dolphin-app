name: Feature request
description: Propose something Dolphin does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If the idea is still loose, start a thread in [Discussions](https://github.com/Nicoo01x/dolphin-app/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe what you are trying to do and where Dolphin gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behavior you have in mind. Screens, commands or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use now, or how other tools handle it.
  - type: dropdown
    id: part
    attributes:
      label: Which part of Dolphin?
      options:
        - Desktop app
        - CLI or terminal app (dolphin)
        - Local web console (dolphin ui)
        - The gate
        - Agent support
        - Not sure
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
